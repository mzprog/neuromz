# CI for the library: Linux (GCC, Clang; Release and sanitizers), Windows
# (MSVC), macOS (Apple Clang), and the CUDA backend compiled on Linux and
# Windows. No dataset downloads and no benchmarks here: the MNIST regression
# is skipped when data/ is absent (see data.yml). The runners have no GPU, so
# the CUDA jobs also check that a CUDA build runs without one: the CPU tests
# pass, "auto" falls back to the CPU, and the GPU tests report "skipped".
name: CI
on:
  push:
    branches: [2.0.0-dev, master] # development happens on 2.0.0-dev; master moves only at a release
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.cc }} ${{ matrix.openmp == 'ON' && '+ OpenMP' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        openmp: [OFF, ON]
        exclude:
          - cc: clang
            openmp: ON # Ubuntu's clang needs libomp-dev; GCC covers the OpenMP build
    steps:
      - uses: actions/checkout@v5
      - name: PowerShell scripts are ASCII-only (Windows PowerShell 5.1 reads them in the ANSI code page)
        run: "! grep -nP '[^\\x00-\\x7F]' scripts/*.ps1"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.cc }} -DNMZ_OPENMP=${{ matrix.openmp }}
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install and use the package
        run: |
          cmake --install build --prefix "$PWD/stage"
          cmake -S tests/package -B build-pkg -DCMAKE_PREFIX_PATH="$PWD/stage" -DCMAKE_C_COMPILER=${{ matrix.cc }}
          cmake --build build-pkg
          ./build-pkg/use_neuromz

  sanitize:
    name: Linux ${{ matrix.cc }} ASan + UBSan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DNMZ_SANITIZE=ON -DCMAKE_C_COMPILER=${{ matrix.cc }}
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows MSVC ${{ matrix.openmp == 'ON' && '+ OpenMP' || '' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        openmp: [OFF, ON]
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -DNMZ_OPENMP=${{ matrix.openmp }} # the newest Visual Studio, x64
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install and use the package
        shell: bash
        run: |
          cmake --install build --config Release --prefix "$PWD/stage"
          cmake -S tests/package -B build-pkg -DCMAKE_PREFIX_PATH="$PWD/stage"
          cmake --build build-pkg --config Release
          ./build-pkg/Release/use_neuromz.exe

  macos:
    name: macOS Apple Clang
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j 3
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The CUDA backend, compiled (no GPU on the runners). Only nvcc, the CUDA
  # runtime and its headers are needed: cuBLAS is loaded at run time. They
  # come from NVIDIA's redistributable archives (no installer).
  cuda-linux:
    name: Linux CUDA ${{ matrix.cuda }} (compile; tests without a GPU)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cuda: ["13.5.0"]
    steps:
      - uses: actions/checkout@v5
      - name: CUDA ${{ matrix.cuda }} (nvcc, nvvm, runtime, headers)
        run: |
          set -euo pipefail
          base=https://developer.download.nvidia.com/compute/cuda/redist
          curl -fsSL "$base/redistrib_${{ matrix.cuda }}.json" -o redist.json
          mkdir -p "$HOME/cuda"
          for pkg in cuda_nvcc cuda_cudart cuda_crt cccl libnvvm; do
            rel=$(python3 -c "import json; print(json.load(open('redist.json'))['$pkg']['linux-x86_64']['relative_path'])")
            curl -fsSL "$base/$rel" -o pkg.tar.xz
            tar -xf pkg.tar.xz --strip-components=1 -C "$HOME/cuda"
          done
          # the archives install into lib/; nvcc.profile links from lib64/
          [ -e "$HOME/cuda/lib64" ] || ln -s lib "$HOME/cuda/lib64"
          ls "$HOME/cuda/lib64/"
          echo "CUDA=$HOME/cuda" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNMZ_CUDA=ON -DCMAKE_CUDA_COMPILER="$CUDA/bin/nvcc" -DCUDAToolkit_ROOT="$CUDA"
      - name: Build
        run: cmake --build build -j 4
      - name: "Test (no GPU here: the CPU tests pass, auto falls back to the CPU, gpu tests skipped)"
        run: ctest --test-dir build --output-on-failure

  cuda-windows:
    name: Windows MSVC CUDA ${{ matrix.cuda }} (compile; tests without a GPU)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        cuda: ["13.5.0"]
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
      - name: CUDA ${{ matrix.cuda }} (nvcc, nvvm, runtime, headers)
        shell: pwsh
        run: |
          $base = "https://developer.download.nvidia.com/compute/cuda/redist"
          $m = Invoke-RestMethod "$base/redistrib_${{ matrix.cuda }}.json"
          $root = Join-Path $env:RUNNER_TEMP "cuda"
          New-Item -ItemType Directory -Force $root | Out-Null
          foreach ($p in "cuda_nvcc", "cuda_cudart", "cuda_crt", "cccl", "libnvvm") {
            $rel = $m.$p.'windows-x86_64'.relative_path
            Invoke-WebRequest "$base/$rel" -OutFile pkg.zip
            Expand-Archive pkg.zip -DestinationPath unpacked -Force
            $top = Get-ChildItem unpacked | Select-Object -First 1
            Copy-Item (Join-Path $top.FullName "*") $root -Recurse -Force
            Remove-Item unpacked, pkg.zip -Recurse -Force
          }
          "CUDA=$root" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNMZ_CUDA=ON "-DCMAKE_CUDA_COMPILER=$env:CUDA/bin/nvcc.exe" "-DCUDAToolkit_ROOT=$env:CUDA"
      - name: Build
        run: cmake --build build -j 4
      - name: "Test (no GPU here: the CPU tests pass, auto falls back to the CPU, gpu tests skipped)"
        run: ctest --test-dir build --output-on-failure
